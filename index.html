<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envelope Card (Vertical, Single Page)</title>
  <link href="https://fonts.googleapis.com/css?family=Allan:700,400" rel="stylesheet" />
  <style>
    html, body { height: 100%; }

    @font-face {
      font-family: 'Munrae';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202@1.0/SangSangMullaelerOTF.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'MissedSimsim';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-1@1.0/Griun_Simsimche-Rg.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    body{
      margin: 0;
      background: rgb(51, 38, 35);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      perspective: 900px;
      position: relative;
    }

    :root{
      --envW: min(86vw, 360px);
      --envH: calc(var(--envW) * 1.32); 
      --padX: clamp(14px, 4vw, 20px);
      --padY: clamp(14px, 4vw, 22px);
      --lift: calc(var(--envH) * 0.72);
      --fwSize: clamp(58px, 18vw, 120px);
      --fwSizeSm: clamp(48px, 15vw, 100px);
    }

    .fireworks{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .fw{
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--fwSize);
      height: auto;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      will-change: transform, opacity;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.18));
    }
    .fw.sm{ width: var(--fwSizeSm); }
    .fw1{ left: 18%; top: 52%; }
    .fw2{ left: 34%; top: 36%; }
    .fw3{ left: 52%; top: 22%; }
    .fw4{ left: 70%; top: 34%; }
    .fw5{ left: 84%; top: 54%; }
    .fw6{ left: 26%; top: 70%; }
    .fw7{ left: 74%; top: 72%; }
    .fw8{ left: 50%; top: 50%; }

    .fireworks.burst .fw1{ animation: fw-pop 820ms 0ms   cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw2{ animation: fw-pop 820ms 70ms  cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw3{ animation: fw-pop 820ms 140ms cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw4{ animation: fw-pop 820ms 210ms cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw5{ animation: fw-pop 820ms 280ms cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw6{ animation: fw-pop 820ms 350ms cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw7{ animation: fw-pop 820ms 420ms cubic-bezier(.2,.9,.2,1) forwards; }
    .fireworks.burst .fw8{ animation: fw-pop 900ms 200ms cubic-bezier(.2,.9,.2,1) forwards; }

    @keyframes fw-pop{
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.10); }
      18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.00); }
      40%  { opacity: 1; transform: translate(-50%, -50%) scale(0.92); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.28); }
    }

    .envelope{
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--envW);
      height: var(--envH);
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transform-origin: right center;
      user-select: none;
      z-index: 2;
    }

    .front, .back{
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 0;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .front{
      cursor: pointer;
      display: grid;
      place-items: center;
      outline: none;
      z-index: 3;
    }

    .front:focus-visible{ box-shadow: 0 14px 40px rgba(245, 120, 130, 0.22); }

    .mail p{
      margin: 0;
      font-weight: 700;
      text-align: center;
      font-family: 'MissedSimsim', sans-serif;
    }

    .mail p:first-child{
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1;
      color: #4e1b1b;
    }

    .mail p:last-child{
      font-size: clamp(18px, 4.8vw, 24px);
      margin-top: 10px;
      color: #cca371;
    }

    .back{
      transform: rotateY(180deg) translate3d(0,0,1px);
      z-index: 2;
    }

    .letter{
      position: absolute;
      inset: 10px;
      background: url("card.png") center / cover no-repeat;
      border-radius: 0;
      padding: var(--padY) var(--padX);
      box-shadow: 0 10px 60px rgba(245,120,130,.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
      transform: translate3d(0,0,0);
    }




    .box{
      width: 100%;
      height: clamp(140px, 34vw, 210px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 0;
      background: rgba(255, 150, 159, 0.08);
      margin-top: 12px;
    }

    .box img{
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .btnWrap{
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }

    .btnWrap.show{
      opacity: 1;
      pointer-events: auto;
    }

    .btn{
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      white-space: nowrap;

      border: none;
      border-radius: 0;
      padding: 10px 16px;

      font-family: 'MissedSimsim', sans-serif;

      font-size: 18px;
      cursor: pointer;
      background: rgb(51, 38, 35);
      color: #fff;
      box-shadow: none;
      transition: none;
      outline: none;
    }
    .btn:hover{ filter: none; }
    .btn:active{ transform: translate(-50%, -100%); }

    .flip{
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .flip::before{
      content: "";
      position: absolute;
      background: #fff;
      box-shadow: 0 0 80px rgba(245,120,130,.14);
    }

    .top-flip::before,
    .bottom-flip::before{
      width: calc(var(--envW) * 0.92);
      height: calc(var(--envW) * 0.92);
    }

    .top-flip{
      z-index: 5;
      transform-origin: top center;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .top-flip::before{
      transform-origin: top left;
      transform: rotate(-45deg);
      border-bottom-left-radius: 0;
      border-top-left-radius: 0;
      border-bottom-right-radius: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .bottom-flip{ z-index: 4; }

    .bottom-flip::before{
      transform-origin: left bottom;
      transform: rotate(45deg) translate(-14px, -14px);
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-top-right-radius: 0;
    }

    .left-flip::before,
    .right-flip::before{
      width: calc(var(--envW) * 0.66);
      height: calc(var(--envW) * 0.66);
      top: -8px;
    }

    .left-flip{ z-index: 3; }
    .left-flip::before{
      transform-origin: top left;
      transform: rotate(45deg);
      border-top-left-radius: 0;
      border-bottom-right-radius: 0;
      border-top-right-radius: 0;
    }

    .right-flip{ z-index: 2; }
    .right-flip::before{
      right: 0;
      transform-origin: top right;
      transform: rotate(-45deg);
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: 0;
    }

    .envelope.new{ animation: new 0.9s forwards; }
    .envelope.open{ animation: open 2.6s forwards; }

    .envelope.open:not(.closing) .top-flip{ animation: flip-open 0.55s 0.85s forwards; }
    .envelope.open:not(.closing) .letter{ animation: letter-out 0.9s 1.45s forwards; }

    .envelope.closing{ animation: close 2.1s forwards; }
    .envelope.closing .letter{ animation: letter-in 0.75s 0s forwards; }
    .envelope.closing .top-flip{ animation: flip-close 0.6s 0.85s forwards; }

    @keyframes new{
      0%{ transform: translate(calc(-50% - 120vw), -50%); }
      100%{ transform: translate(-50%, -50%); }
    }

    @keyframes open{
      0%{
        transform: translate(-50%, -50%) translate3d(0,0,0) rotateY(0);
      }
      33.333%{
        transform: translate(-50%, -50%) translate3d(-100%,0,0) rotateY(-180deg);
      }
      66.666%{
        transform: translate(-50%, -50%) translate3d(-100%,0,0) rotateY(-180deg);
      }
      100%{
        transform: translate(-50%, -50%) translate3d(-100%, var(--lift), 0) rotateY(-180deg);
      }
    }

    @keyframes close{
      0%{
        transform: translate(-50%, -50%) translate3d(-100%, var(--lift), 0) rotateY(-180deg);
      }
      45%{
        transform: translate(-50%, -50%) translate3d(-100%, 0, 0) rotateY(-180deg);
      }
      100%{
        transform: translate(-50%, -50%) translate3d(0,0,0) rotateY(0deg);
      }
    }

    @keyframes flip-open{
      0%   { transform: rotateX(0deg); }
      100% { transform: rotateX(-180deg); }
    }

    @keyframes flip-close{
      0%   { transform: rotateX(-180deg); }
      100% { transform: rotateX(0deg); }
    }

    @keyframes letter-out{
      0%   { transform: translate3d(0,0,0); }
      100% { transform: translate3d(0, calc(var(--lift) * -1), 0); }
    }

    @keyframes letter-in{
      0%   { transform: translate3d(0, calc(var(--lift) * -1), 0); }
      100% { transform: translate3d(0,0,0); }
    }
  </style>
</head>
<body>

  <div class="fireworks" id="fireworks" aria-hidden="true">
    <img class="fw fw1 sm" src="firework.png" alt="" />
    <img class="fw fw2"    src="firework.png" alt="" />
    <img class="fw fw3 sm" src="firework.png" alt="" />
    <img class="fw fw4"    src="firework.png" alt="" />
    <img class="fw fw5 sm" src="firework.png" alt="" />
    <img class="fw fw6 sm" src="firework.png" alt="" />
    <img class="fw fw7 sm" src="firework.png" alt="" />
    <img class="fw fw8"    src="firework.png" alt="" />
  </div>

  <div class="btnWrap" id="btnWrap">
    <button class="btn" id="putBtn" type="button">[넣기]</button>
  </div>

  <div class="envelope new" id="env">
    <div class="front" id="envFront" role="button" tabindex="0" aria-label="카드 열기">
      <div class="mail">
        <p>새해카드가<br>도착했어요.</p>
        <br>
        <p>보내는 사람 · 송주현</p>
                <p>탭하여 열어주세요.</p>

      </div>
    </div>

    <div class="back">
      <div class="letter" id="letter">
        <p class="letterText"></p>

        <div class="box"></div>

        <p class="letterText signature"></p>
      </div>

      <div class="flip left-flip"></div>
      <div class="flip right-flip"></div>
      <div class="flip bottom-flip"></div>
      <div class="flip top-flip"></div>
    </div>
  </div>

  <script>
    (() => {
      const env = document.getElementById("env");
      const front = document.getElementById("envFront");

      const btnWrap = document.getElementById("btnWrap");
      const putBtn  = document.getElementById("putBtn");

      const fireworks = document.getElementById("fireworks");

      let opened = false;
      let closing = false;

      const positionButton = () => {
        const r = env.getBoundingClientRect();
        const gap = 10;
        const x = r.left + (r.width / 2);
        const y = r.top - gap;
        btnWrap.style.left = x + "px";
        btnWrap.style.top = y + "px";
      };

      const showButton = () => {
        positionButton();
        btnWrap.classList.add("show");
      };

      const hideButton = () => {
        btnWrap.classList.remove("show");
      };

      const burstFireworks = () => {
        fireworks.classList.remove("burst");
        void fireworks.offsetWidth;
        fireworks.classList.add("burst");
      };

      const openEnvelope = () => {
        if (opened || closing) return;
        opened = true;

        env.classList.remove("new");
        env.classList.add("open");
        setTimeout(burstFireworks, 1150);

        setTimeout(showButton, 1450);

        const start = performance.now();
        const track = (t) => {
          if (!btnWrap.classList.contains("show")) return;
          positionButton();
          if (t - start < 1800) requestAnimationFrame(track);
        };
        requestAnimationFrame(track);
      };

      const closeEnvelopeToInitial = () => {
        if (!opened || closing) return;
        closing = true;

        hideButton();
        fireworks.classList.remove("burst");

        env.classList.remove("open");
        void env.offsetWidth;
        env.classList.add("closing");

        setTimeout(() => {
          env.classList.remove("closing");
          opened = false;
          closing = false;
        }, 2150);
      };

      front.addEventListener("click", openEnvelope);
      front.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openEnvelope();
        }
      });

      putBtn.addEventListener("click", closeEnvelopeToInitial);

      window.addEventListener("resize", () => {
        if (btnWrap.classList.contains("show")) positionButton();
      });
    })();
  </script>

</body>
</html>
